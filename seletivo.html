<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1930">
<title>Inscrições · LACGA UFMA</title>
<meta name="description" content="Inscrições do processo seletivo da LACGA – Liga Acadêmica de Cirurgia Geral e Anatomia Cirúrgica da UFMA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Inter_24pt-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Syne-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Fontes da identidade visual (pasta fonts/) */
  @font-face{font-family:"Syne";src:url("fonts/Syne-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Syne";src:url("fonts/Syne-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
  @font-face{font-family:"Inter";src:url("fonts/Inter_24pt-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Inter";src:url("fonts/Inter_24pt-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Inter";src:url("fonts/Inter_24pt-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}

  /* Mesmas cores e fontes do site principal (index.html). CSS escrito para o celular primeiro. */
  :root{
    --navy:#0d1930;
    --azul-vivo:#2A4BB0;
    --nevoa:#8FA3CF;
    --azul-liga:#23375C;
    --fundo:#EEEEEE;
    --card:#FFFFFF;
    --tinta:#1B1E27;
    --suave:#5D6373;
    --linha:#DCDEE3;
    --r:18px;
    --wide:"Syne",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --topo:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;font-family:var(--body);font-size:1rem;line-height:1.6;color:var(--tinta);background:var(--fundo);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  img{max-width:100%;height:auto;display:block}
  a{color:inherit}
  .wrap{width:min(640px,100% - 32px);margin-inline:auto}
  :focus-visible{outline:2px solid var(--azul-vivo);outline-offset:2px}

  /* Barra de cima: só logo e "Voltar ao site" */
  .topo{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--linha)}
  .topo .wrap{width:min(1120px,100% - 32px);height:var(--topo);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .marca{display:flex;align-items:center;gap:10px;text-decoration:none}
  .marca img{width:38px;height:38px;border-radius:50%}
  .marca b{display:block;font-family:var(--wide);font-weight:800;letter-spacing:.06em;color:var(--navy);line-height:1}
  .marca small{display:block;font-size:.62rem;letter-spacing:.2em;color:var(--suave);font-weight:500;margin-top:4px;line-height:1}
  .voltar{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:999px;border:1.5px solid var(--linha);color:var(--navy);font-size:.86rem;font-weight:600;text-decoration:none;white-space:nowrap}
  .voltar svg{width:18px;height:18px}
  @media (hover:hover){.voltar:hover{border-color:var(--azul-liga);background:var(--azul-liga);color:#fff}}

  /* Topo azul com a logo ao fundo */
  .hero{position:relative;overflow:hidden;background:radial-gradient(130% 90% at 50% 0%,#2F4C85 0%,#1A2C52 48%,#070E1E 100%);color:#fff;padding:32px 0 30px}
  .hero .wrap{position:relative;z-index:1}
  .hero-marca{position:absolute;z-index:0;right:-18%;top:50%;transform:translateY(-50%);width:min(380px,75vw);max-width:none;opacity:.08;pointer-events:none;user-select:none}
  .hero .eyebrow{color:var(--nevoa)}
  .hero h1{color:#fff;margin:8px 0 0;font-size:clamp(1.9rem,8.6vw,3.6rem)}
  /* Status das inscrições (aberto = bolinha verde) */
  .status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.12);color:#fff}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:#C5C9D3}
  .status.aberto::before{background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.25)}
  @media (min-width:900px){.hero{padding:64px 0 56px}.hero-marca{right:4%;width:340px}}

  /* Conteúdo */
  main{flex:1;padding:28px 0 48px}
  .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--azul-liga)}
  h1,.titulo{font-family:var(--wide);font-weight:800;letter-spacing:-.02em;line-height:1.08;font-size:clamp(1.9rem,8vw,2.8rem);color:var(--navy)}
  .titulo{margin:0 0 20px}
  .bloco{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:20px}
  .bloco + .bloco{margin-top:14px}
  .bloco h2{font-family:var(--wide);font-weight:800;font-size:1.1rem;line-height:1.3;color:var(--navy);margin-bottom:14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;background:var(--azul-liga);color:#fff;font-weight:600;text-decoration:none;transition:background .2s}
  .btn svg{width:18px;height:18px;flex:none}
  @media (hover:hover){.btn:hover{background:var(--azul-vivo)}}
  .aviso{color:var(--suave);font-size:.95rem}

  /* Edital e material de apoio: um PDF por linha, com botão de baixar */
  .materiais{list-style:none}
  .material{display:flex;align-items:center;gap:12px;padding:12px 0}
  .material + .material{border-top:1px solid var(--linha)}
  .material-icone{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--fundo);color:var(--azul-liga)}
  .material-icone svg{width:20px;height:20px}
  .material b{flex:1;min-width:0;font-weight:600;color:var(--navy);line-height:1.35}
  .baixar{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--azul-liga);color:var(--azul-liga);font-size:.86rem;font-weight:600;text-decoration:none}
  .baixar svg{width:16px;height:16px}
  @media (hover:hover){.baixar:hover{background:var(--azul-liga);color:#fff}}
  @media (min-width:600px){main{padding:48px 0 72px}.bloco{padding:26px}}

  /* Rodapé */
  footer{background:var(--navy);padding:24px 0;padding-bottom:calc(24px + env(safe-area-inset-bottom));text-align:center}
  .credit{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;color:#D3DBEE;font-size:.92rem}
  .credit a{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#fff;color:var(--navy);font-weight:700;text-decoration:none}
  .credit a:hover{background:#0A66C2;color:#fff}
  .credit svg{width:18px;height:18px;flex:none}
</style>
</head>
<body>

<header class="topo">
  <div class="wrap">
    <a href="index.html" class="marca" aria-label="LACGA UFMA, página inicial">
      <img src="imgs/logo-web-96.png" alt="" width="38" height="38">
      <span><b>LACGA</b><small>UFMA</small></span>
    </a>
    <a class="voltar" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      Voltar ao site
    </a>
  </div>
</header>

<section class="hero">
  <img class="hero-marca" src="imgs/logo-web1-480.png" alt="" aria-hidden="true" width="400" height="400">
  <div class="wrap">
    <p class="eyebrow">Processo seletivo</p>
    <h1>Faça parte da LACGA</h1>
    <p class="status" id="status">Inscrições encerradas</p>
  </div>
</section>

<!-- O edital, o link do formulário e os PDFs ficam em seletivo/seletivo.js -->
<main>
  <div class="wrap">
    <div class="bloco">
      <h2>Edital</h2>
      <div id="edital"></div>
    </div>

    <div class="bloco">
      <h2>Formulário de inscrição</h2>
      <div id="formulario"></div>
    </div>

    <div class="bloco">
      <h2>Material de apoio</h2>
      <div id="materiais"></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span class="credit">Site desenvolvido por <a href="https://www.linkedin.com/in/sarahreginadev/" target="_blank" rel="noopener" aria-label="Sarah Regina no LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>Sarah Regina</a></span>
  </div>
</footer>

<script src="seletivo/seletivo.js"></script>
<script>
  (function(){
    const S = window.SELETIVO || {};

    /* Status no topo */
    const status = document.getElementById('status');
    status.textContent = S.inscricoesAbertas ? 'Inscrições abertas' + (S.periodo ? ' · ' + S.periodo : '') : 'Inscrições encerradas';
    status.classList.toggle('aberto', !!S.inscricoesAbertas);
    const icForm = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M15 5h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3M9 12h6M9 16h4"/></svg>';
    const icPdf = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>';
    const icBaixar = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
    function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
    // Uma linha com ícone de PDF, nome e botão "Baixar"
    function linhaPdf(titulo, url, nomeArquivo){
      const item = el('li', 'material');
      const icone = el('span', 'material-icone'); icone.innerHTML = icPdf;
      const baixar = el('a', 'baixar'); baixar.href = url;
      if (nomeArquivo) baixar.download = nomeArquivo; else { baixar.target = '_blank'; baixar.rel = 'noopener'; }
      baixar.setAttribute('aria-label', 'Baixar ' + titulo); baixar.innerHTML = icBaixar; baixar.append('Baixar');
      item.append(icone, el('b', null, titulo), baixar);
      return item;
    }

    /* Edital: nome do PDF dentro de seletivo/ ou um link completo */
    const edital = document.getElementById('edital');
    if (S.edital) {
      const externo = /^https?:\/\//.test(S.edital);
      const lista = el('ul', 'materiais');
      lista.append(linhaPdf('Edital do processo seletivo', externo ? S.edital : 'seletivo/' + encodeURIComponent(S.edital), externo ? '' : S.edital));
      edital.append(lista);
    } else {
      edital.append(el('p', 'aviso', 'O edital estará disponível aqui quando for publicado.'));
    }

    /* Formulário */
    const form = document.getElementById('formulario');
    if (S.linkFormulario) {
      const a = el('a', 'btn'); a.href = S.linkFormulario; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = icForm; a.append('Abrir formulário');
      form.append(a);
    } else {
      form.append(el('p', 'aviso', 'O formulário estará disponível aqui quando as inscrições abrirem.'));
    }

    /* Material de apoio (PDFs em seletivo/materiais/) */
    const caixa = document.getElementById('materiais');
    const materiais = (Array.isArray(S.materiais) ? S.materiais : []).filter(m => m && m.titulo && m.arquivo);
    if (!materiais.length) {
      caixa.append(el('p', 'aviso', 'Em breve, o material de apoio estará disponível aqui.'));
    } else {
      const lista = el('ul', 'materiais');
      materiais.forEach(m => lista.append(linhaPdf(m.titulo, 'seletivo/materiais/' + encodeURIComponent(m.arquivo), m.arquivo)));
      caixa.append(lista);
    }
  })();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
